<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Livestream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            background-color: #222;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        
        .header {
            background-color: #111;
            color: #fff;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #0066cc;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .status {
            font-size: 12px;
            color: #aaa;
        }
        
        .video-container {
            width: 100%;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding-bottom: 56.25%;
        }
        
        #video {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        
        .controls {
            background-color: #111;
            padding: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 20px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #0052a3;
        }
        
        button:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
        
        .error-message {
            display: none;
            background-color: #d32f2f;
            color: white;
            padding: 15px;
            margin: 20px;
            border-radius: 4px;
        }
        
        .success-message {
            display: none;
            background-color: #388e3c;
            color: white;
            padding: 15px;
            margin: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CCTV Livestream</h1>
            <div class="status" id="status">Connecting...</div>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <div class="video-container">
            <video id="video" controls autoplay muted playsinline></video>
        </div>
        
        <div class="controls">
            <button id="playBtn" onclick="playStream()">Play</button>
            <button id="pauseBtn" onclick="pauseStream()">Pause</button>
            <button id="restartBtn" onclick="restartStream()">Restart Stream</button>
            <button id="fullscreenBtn" onclick="toggleFullscreen()">Fullscreen</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        let hls = null;
        const video = document.getElementById("video");
        const statusDiv = document.getElementById("status");
        const errorDiv = document.getElementById("errorMessage");
        const successDiv = document.getElementById("successMessage");

        function showMessage(message, type = "error") {
            const messageDiv = type === "error" ? errorDiv : successDiv;
            const otherDiv = type === "error" ? successDiv : errorDiv;
            
            messageDiv.textContent = message;
            messageDiv.style.display = "block";
            otherDiv.style.display = "none";
            
            if (type === "success") {
                setTimeout(() => {
                    messageDiv.style.display = "none";
                }, 5000);
            }
        }

        function updateStatus(message) {
            statusDiv.textContent = message;
        }

        function initializeHLS() {
            const src = "/hls/stream.m3u8?cb=" + Date.now();

            if (Hls.isSupported()) {
                if (hls) {
                    hls.destroy();
                }
                
                hls = new Hls({
                    liveDurationInfinity: true,
                    lowLatencyMode: false,
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                });

                hls.loadSource(src);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    updateStatus("Connected");
                    showMessage("Stream loaded successfully", "success");
                    video.play();
                });

                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                updateStatus("Network error - retrying...");
                                setTimeout(() => hls.startLoad(), 2000);
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                updateStatus("Media error - recovering...");
                                hls.recoverMediaError();
                                break;
                            default:
                                updateStatus("Critical error - restarting...");
                                setTimeout(() => restartStream(), 3000);
                        }
                    }
                });
            } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                video.src = src;
                updateStatus("Connected (Native HLS)");
            } else {
                updateStatus("Browser not supported");
                showMessage("Your browser does not support HLS streaming. Please use Chrome, Safari, Firefox, or Edge.", "error");
            }
        }

        function playStream() {
            video.play().catch(e => console.log("Play failed:", e));
        }

        function pauseStream() {
            video.pause();
        }

        function restartStream() {
            updateStatus("Restarting stream...");
            if (hls) {
                hls.destroy();
                hls = null;
            }
            video.src = "";
            setTimeout(initializeHLS, 1000);
        }

        function toggleFullscreen() {
            if (video.requestFullscreen) {
                video.requestFullscreen();
            } else if (video.webkitRequestFullscreen) {
                video.webkitRequestFullscreen();
            } else if (video.mozRequestFullScreen) {
                video.mozRequestFullScreen();
            } else if (video.msRequestFullscreen) {
                video.msRequestFullscreen();
            }
        }

        // Initialize on page load
        window.addEventListener("load", initializeHLS);

        // Handle visibility changes
        document.addEventListener("visibilitychange", function () {
            if (document.hidden) {
                if (hls) {
                    hls.stopLoad();
                }
            } else {
                if (hls) {
                    hls.startLoad();
                }
            }
        });
    </script>
</body>
</html>
